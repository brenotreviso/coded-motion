<!doctype html>
<html lang="en">
<head>
<title>Hello GSAP · Coded Motion</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../tokens/tokens.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Nunito:wght@400;700&display=swap" />
<style>
  /* Fallbacks after the comma keep this file working even without tokens.css */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--color-cream, #fbf4e9); color: var(--color-ink, #3b2f2a);
         font-family: var(--font-body, Nunito, Arial, sans-serif); }
  h1 { font-family: var(--font-display, Fraunces, Georgia, serif); font-weight: 600; margin: 0 0 8px; font-size: 28px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
  .hint { opacity: .75; margin: 0 0 24px; line-height: 1.5; }
  button { font: inherit; background: var(--color-ink, #3b2f2a); color: var(--color-cream, #fbf4e9); border: 0;
           border-radius: 999px; padding: 10px 20px; cursor: pointer; }
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
</head>
<body>
<div class="wrap">
  <h1>00 · Hello GSAP</h1>
  <p class="hint">Your first tween. A <b>tween</b> is one animation from one state to another. Change the numbers in the script and refresh.</p>
  <div id="dot" style="width:80px;height:80px;border-radius:50%;background:var(--color-apricot,#f2a65a)"></div>
  <p><button id="again">Play again</button></p>
</div>
<script>
  // gsap.to(target, settings): animate FROM where it is now TO these values.
  const tween = gsap.to("#dot", {
    x: 400,               // move 400 px to the right (x = horizontal)
    duration: 1,          // seconds
    ease: "power2.out",   // start fast, slow down at the end
    delay: 0.3
  });
  document.querySelector("#again").addEventListener("click", () => tween.restart());
</script>
</body>
</html>
