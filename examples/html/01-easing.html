<!doctype html>
<html lang="en">
<head>
<title>Easing · Coded Motion</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../tokens/tokens.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Nunito:wght@400;700&display=swap" />
<style>
  /* Fallbacks after the comma keep this file working even without tokens.css */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--color-cream, #fbf4e9); color: var(--color-ink, #3b2f2a);
         font-family: var(--font-body, Nunito, Arial, sans-serif); }
  h1 { font-family: var(--font-display, Fraunces, Georgia, serif); font-weight: 600; margin: 0 0 8px; font-size: 28px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
  .hint { opacity: .75; margin: 0 0 24px; line-height: 1.5; }
  button { font: inherit; background: var(--color-ink, #3b2f2a); color: var(--color-cream, #fbf4e9); border: 0;
           border-radius: 999px; padding: 10px 20px; cursor: pointer; }
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/CustomEase.min.js"></script>
</head>
<body>
<style>
  .row { display:flex; align-items:center; gap:16px; height:64px; border-bottom:1px dashed rgba(59,47,42,.2); }
  .row span { width:190px; font-size:14px; }
  .lane { position:relative; flex:1; height:100%; }
  .ball { position:absolute; top:12px; left:0; width:40px; height:40px; border-radius:50%; background:var(--color-apricot,#f2a65a); }
</style>
<div class="wrap">
  <h1>01 · Easing</h1>
  <p class="hint">Every ball takes exactly the same time (1.2 s). Only the <b>easing</b> (how speed changes over time) is different. Watch which ones feel heavy, lazy, snappy or bouncy.</p>
  <div id="rows"></div>
  <p><button id="again">Play again</button></p>
</div>
<script>
  gsap.registerPlugin(CustomEase);
  // Our brand easings from tokens (motion.easing.*), turned into named GSAP eases.
  CustomEase.create("ll-enter", "0.16,1,0.3,1");
  CustomEase.create("ll-move",  "0.65,0,0.35,1");
  CustomEase.create("ll-soft",  "0.37,0,0.63,1");

  const eases = [
    ["none (linear)", "none"],
    ["power2.in (ease-in)", "power2.in"],
    ["power2.out (ease-out)", "power2.out"],
    ["power2.inOut", "power2.inOut"],
    ["ll-enter (token)", "ll-enter"],
    ["ll-move (token)", "ll-move"],
    ["back.out(1.7) overshoot", "back.out(1.7)"],
    ["elastic.out (springy)", "elastic.out(1, 0.4)"],
    ["bounce.out", "bounce.out"]
  ];
  const rows = document.querySelector("#rows");
  const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.8, yoyo: true });
  eases.forEach(([label, ease]) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span>${label}</span><div class="lane"><div class="ball"></div></div>`;
    rows.appendChild(row);
    const lane = row.querySelector(".lane");
    // Position 0 in the timeline = all start together.
    tl.to(row.querySelector(".ball"), { x: () => lane.clientWidth - 40, duration: 1.2, ease }, 0);
  });
  document.querySelector("#again").addEventListener("click", () => tl.restart());
</script>
</body>
</html>
