<!doctype html>
<html lang="en">
<head>
<title>Arcs and bezier paths · Coded Motion</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../tokens/tokens.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Nunito:wght@400;700&display=swap" />
<style>
  /* Fallbacks after the comma keep this file working even without tokens.css */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--color-cream, #fbf4e9); color: var(--color-ink, #3b2f2a);
         font-family: var(--font-body, Nunito, Arial, sans-serif); }
  h1 { font-family: var(--font-display, Fraunces, Georgia, serif); font-weight: 600; margin: 0 0 8px; font-size: 28px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
  .hint { opacity: .75; margin: 0 0 24px; line-height: 1.5; }
  button { font: inherit; background: var(--color-ink, #3b2f2a); color: var(--color-cream, #fbf4e9); border: 0;
           border-radius: 999px; padding: 10px 20px; cursor: pointer; }
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/MotionPathPlugin.min.js"></script>
</head>
<body>
<div class="wrap">
  <h1>02 · Arcs &amp; bezier paths</h1>
  <p class="hint">Living things rarely move in straight lines. Top: a straight path (feels mechanical). Bottom: the same jump on a curved <b>bezier path</b>, with <code>autoRotate</code> so the leaf faces where it is going.</p>
  <svg viewBox="0 0 800 420" width="100%" style="max-width:800px;display:block">
    <path id="straight" d="M60,150 L740,150" fill="none" stroke="#3b2f2a" stroke-opacity=".25" stroke-dasharray="6 8" stroke-width="2"/>
    <!-- C = cubic bezier: two control points (x1,y1 x2,y2) pull the curve, then the end point -->
    <path id="arc" d="M60,380 C220,180 560,180 740,380" fill="none" stroke="#3b2f2a" stroke-opacity=".25" stroke-dasharray="6 8" stroke-width="2"/>
    <circle cx="220" cy="180" r="5" fill="#9bb59a"/><circle cx="560" cy="180" r="5" fill="#9bb59a"/>
    <text x="230" y="172" font-size="13" fill="#3b2f2a">control point 1</text>
    <text x="570" y="172" font-size="13" fill="#3b2f2a">control point 2</text>
    <g id="leafA"><ellipse rx="22" ry="12" fill="#9bb59a"/><line x1="-22" x2="22" stroke="#3b2f2a" stroke-width="2"/></g>
    <g id="leafB"><ellipse rx="22" ry="12" fill="#f2a65a"/><line x1="-22" x2="22" stroke="#3b2f2a" stroke-width="2"/></g>
  </svg>
  <p><button id="again">Play again</button></p>
</div>
<script>
  gsap.registerPlugin(MotionPathPlugin);
  const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.6 });
  tl.to("#leafA", { duration: 2, ease: "power1.inOut",
        motionPath: { path: "#straight", align: "#straight", alignOrigin: [0.5, 0.5] } }, 0)
    .to("#leafB", { duration: 2, ease: "power1.inOut",
        motionPath: { path: "#arc", align: "#arc", alignOrigin: [0.5, 0.5], autoRotate: true } }, 0);
  document.querySelector("#again").addEventListener("click", () => tl.restart());
</script>
</body>
</html>
