<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Library demo · Coded Motion</title>
<link rel="stylesheet" href="../../tokens/tokens.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Nunito:wght@400;700&display=swap" />
<style>
  body { margin:0; background:var(--color-dusk,#5e668d); color:var(--color-cream,#fbf4e9); font-family:var(--font-body,Nunito,sans-serif); }
  .wrap { max-width:900px; margin:0 auto; padding:32px 24px; text-align:center; }
  h1 { font-family:var(--font-display,Fraunces,serif); font-weight:600; font-size:28px; }
  .cap { font-family:var(--font-display,Fraunces,serif); font-size:40px; line-height:1.2; max-width:520px; margin:0 auto; }
  .cap .on { color:var(--color-honey,#f9d27d); }
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/CustomEase.min.js"></script>
<script src="../../library/gsap/life-kit.js"></script>
<script src="../../library/gsap/text-kit.js"></script>
</head>
<body>
<div class="wrap">
  <h1>09 · Using the library (no new animation code)</h1>
  <svg viewBox="0 0 400 360" width="300" style="display:block;margin:0 auto">
    <g id="glow">
      <path id="flame" d="M200 40 C 186 68, 188 82, 200 90 C 212 82, 214 68, 200 40 Z" fill="#f9d27d"/>
      <g id="body">
        <path d="M120 190 C 120 120, 160 88, 200 88 C 240 88, 280 120, 280 190 C 280 255, 245 288, 200 288 C 155 288, 120 255, 120 190 Z" fill="#f2a65a"/>
        <g id="eyes"><ellipse cx="172" cy="180" rx="8" ry="11" fill="#3b2f2a"/><ellipse cx="228" cy="180" rx="8" ry="11" fill="#3b2f2a"/></g>
      </g>
    </g>
  </svg>
  <p class="cap" id="cap">Rest is part of the work.</p>
</div>
<script>
  gsap.registerPlugin(CustomEase);
  CustomEase.create("ll-enter", "0.16,1,0.3,1");
  CM.arrive("#glow", { from: 80 });
  CM.idle({ root: "#glow", body: "#body", eyes: "#eyes", loose: "#flame" });
  document.fonts.ready.then(() => CM.wordReveal("#cap").repeat(-1).repeatDelay(1));
</script>
</body>
</html>
